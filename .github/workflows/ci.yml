name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Testler
        run: python -m unittest discover -s companion/tests -v
      - name: Kabuk betikleri
        if: runner.os != 'Windows'
        run: bash -n packaging/macos/install.sh && bash -n packaging/macos/uninstall.sh
