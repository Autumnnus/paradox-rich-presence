name: Release

# v* etiketiyle bir GitHub surumu yayinlar. SignPath ayarliysa exe imzalanir (release-signing,
# SignPath panelinden elle onay gerekir); ayarli degilse imzasiz exe "on surum" olarak yayinlanir.
# SignPath Foundation basvurusu projenin once yayinlanmis olmasini istedigi icin ilk surum
# imzasiz cikabilir. Elle calistirildiginda (workflow_dispatch) yalnizca artifact uretir.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Testler
        run: python -m unittest discover -s companion/tests -v

      - name: Surum
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            code=$(python -c "import sys; sys.path.insert(0, 'companion'); import paradox_rich_presence as p; print(p.__version__)")
            if [ "$version" != "$code" ]; then
              echo "::error::Etiket ($version) ile __version__ ($code) ayni olmali."
              exit 1
            fi
          else
            version=$(python -c "import sys; sys.path.insert(0, 'companion'); import paradox_rich_presence as p; print(p.__version__)")
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Derle
        shell: bash
        run: |
          pip install "pyinstaller==6.*"
          python packaging/windows/make_version_info.py "${{ steps.version.outputs.version }}" > version_info.txt
          pyinstaller --noconfirm --clean --onefile --noconsole \
            --name ParadoxRichPresence \
            --version-file version_info.txt \
            --paths companion \
            --add-data "companion/paradox_rich_presence/data;paradox_rich_presence/data" \
            companion/run.py

      - name: Imzasiz derlemeyi yukle
        id: upload-unsigned
        uses: actions/upload-artifact@v7
        with:
          name: ParadoxRichPresence-unsigned
          path: dist/ParadoxRichPresence.exe
          if-no-files-found: error

      - name: SignPath ile imzala
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'paradox-rich-presence' }}
          signing-policy-slug: ${{ startsWith(github.ref, 'refs/tags/v') && 'release-signing' || 'test-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG || 'initial' }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          parameters: |
            version: "${{ steps.version.outputs.version }}"
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Imzasiz dosyayi kullan (SignPath ayarlanmamis)
        if: vars.SIGNPATH_ORGANIZATION_ID == ''
        shell: bash
        run: mkdir -p signed && cp dist/ParadoxRichPresence.exe signed/

      - name: Sonucu yukle
        uses: actions/upload-artifact@v7
        with:
          name: ParadoxRichPresence-windows
          path: signed/ParadoxRichPresence.exe

      - name: GitHub surumu
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            signed/ParadoxRichPresence.exe
            packaging/macos/install.sh
            packaging/macos/uninstall.sh
          generate_release_notes: true
          prerelease: ${{ vars.SIGNPATH_ORGANIZATION_ID == '' }}
